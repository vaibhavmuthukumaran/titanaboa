<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Titanaboa</title>
<style>
:root { color-scheme: dark; font-family: "Courier New", Courier, monospace; background: #000; color: #fff; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
button, input { font: inherit; }
canvas { display: block; image-rendering: auto; }
.screen { position: fixed; inset: 0; overflow: auto; padding: 20px; background: #000; }
#setup, #result { display: grid; place-items: center; }
.panel { width: min(100%, 780px); margin: auto; padding: clamp(18px, 4vw, 36px); border: 2px solid #fff; }
.eyebrow { margin: 0 0 12px; font-size: 11px; letter-spacing: 3px; }
h1, h2 { margin: 0 0 20px; font-size: clamp(26px, 6vw, 46px); line-height: 1; letter-spacing: 3px; }
.instructions { margin: 0 0 28px; font-size: 13px; line-height: 1.8; }
.settings { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 30px; align-items: center; margin-bottom: 28px; }
.speed-label { display: block; margin-bottom: 18px; font-size: 14px; font-weight: bold; letter-spacing: 2px; }
.speed-value { display: block; margin-bottom: 18px; font-size: 18px; font-weight: bold; }
input[type="range"] { appearance: none; -webkit-appearance: none; display: block; width: 100%; height: 28px; margin: 0; background: #000; cursor: pointer; touch-action: pan-y; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border: 0; background: #fff; }
input[type="range"]::-moz-range-track { height: 4px; border: 0; background: #fff; }
input[type="range"]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 16px; height: 24px; margin-top: -10px; border: 2px solid #fff; border-radius: 0; background: #000; }
input[type="range"]::-moz-range-thumb { width: 12px; height: 20px; border: 2px solid #fff; border-radius: 0; background: #000; }
.range-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; letter-spacing: 1px; }
.preview-label { margin: 0 0 10px; font-size: 11px; letter-spacing: 2px; }
#preview-frame { display: grid; place-items: center; width: 100%; height: 180px; overflow: hidden; border: 1px solid #fff; background: #000; }
button { min-height: 44px; padding: 11px 22px; border: 2px solid #fff; border-radius: 0; background: #fff; color: #000; font-weight: bold; font-size: 14px; letter-spacing: 2px; cursor: pointer; }
button:hover { background: #000; color: #fff; }
button:focus-visible, input:focus-visible { outline: 2px dashed #fff; outline-offset: 6px; }
.fine-print { margin: 18px 0 0; font-size: 11px; line-height: 1.6; }
#game { position: fixed; inset: 0; display: grid; grid-template-rows: 24px minmax(0, 1fr); gap: 4px; padding: 6px; overflow: hidden; background: #000; }
#score { align-self: center; justify-self: center; margin: 0; font-size: 16px; line-height: 24px; font-weight: bold; font-variant-numeric: tabular-nums; }
#arena { display: grid; place-items: center; min-width: 0; min-height: 0; overflow: hidden; }
.board-frame { width: fit-content; height: fit-content; border: 1px solid #fff; }
#result .panel { max-width: 520px; text-align: center; }
#result-message { margin: 0 0 26px; font-size: 15px; line-height: 1.8; white-space: pre-line; }
@media (max-width: 560px) {
  .screen { padding: 12px; }
  .settings { grid-template-columns: 1fr; gap: 24px; }
  #preview-frame { height: 150px; }
  .instructions { font-size: 12px; }
}
@media (max-height: 520px) and (min-width: 561px) {
  .screen { padding: 12px; }
  .panel { padding: 18px; }
  h1 { margin-bottom: 12px; font-size: 30px; }
  .instructions { margin-bottom: 16px; font-size: 11px; }
  .settings { margin-bottom: 16px; }
  #preview-frame { height: 120px; }
  .fine-print { margin-top: 10px; }
}

fieldset { min-width:0; margin:24px 0 0; padding:0; border:0; }
legend { margin-bottom:12px; padding:0; font-size:12px; font-weight:bold; letter-spacing:2px; }
.mode-option { display:grid; grid-template-columns:14px 1fr; align-items:start; gap:9px; margin-top:12px; cursor:pointer; }
input[type="radio"] { appearance:none; -webkit-appearance:none; width:12px; height:12px; margin:2px 0 0; border:1px solid #fff; border-radius:0; background:#000; cursor:pointer; }
input[type="radio"]:checked { background:#fff; }
.mode-name { display:block; font-size:13px; font-weight:bold; }
.mode-description { display:block; margin-top:4px; font-size:10px; line-height:1.5; }

/* Touch layout is additive; desktop artwork and the logical grid are unchanged. */
:root { --viewport-width:100vw; --viewport-height:100vh; --pad-button:56px; --pad-gap:8px; }
@supports (height:100dvh) { :root { --viewport-height:100dvh; } }
#game, .screen {
  inset:auto; top:0; left:0;
  width:var(--viewport-width); height:var(--viewport-height);
  padding-top:max(6px,env(safe-area-inset-top,0px));
  padding-right:max(6px,env(safe-area-inset-right,0px));
  padding-bottom:max(6px,env(safe-area-inset-bottom,0px));
  padding-left:max(6px,env(safe-area-inset-left,0px));
}
.screen {
  padding-top:max(20px,env(safe-area-inset-top,0px));
  padding-right:max(20px,env(safe-area-inset-right,0px));
  padding-bottom:max(20px,env(safe-area-inset-bottom,0px));
  padding-left:max(20px,env(safe-area-inset-left,0px));
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
}
.has-touch .screen {
  padding-top:max(12px,env(safe-area-inset-top,0px));
  padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(12px,env(safe-area-inset-left,0px));
}
#game { touch-action:none; overscroll-behavior:none; }
.touch-hint { display:none; }
.has-touch .touch-hint { display:inline; }
.has-touch #game { grid-template-rows:24px minmax(0,1fr) auto; }
#touch-controls {
  display:grid; place-items:center; padding:6px 0 2px;
  min-width:0; touch-action:none; user-select:none; -webkit-user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
}
.direction-pad {
  display:grid;
  grid-template-columns:repeat(3,var(--pad-button));
  grid-template-rows:repeat(3,var(--pad-button));
  gap:var(--pad-gap); touch-action:none;
}
#touch-controls .direction-button {
  display:grid; place-items:center;
  width:var(--pad-button); height:var(--pad-button);
  min-width:48px; min-height:48px; margin:0; padding:0;
  border:1px solid #747774; border-radius:8px;
  background:#111; color:#f8f8ef; touch-action:none;
  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
.direction-button[data-direction="ArrowUp"] { grid-row:1; grid-column:2; }
.direction-button[data-direction="ArrowLeft"] { grid-row:2; grid-column:1; }
.direction-button[data-direction="ArrowRight"] { grid-row:2; grid-column:3; }
.direction-button[data-direction="ArrowDown"] { grid-row:3; grid-column:2; }
.direction-button svg { width:26px; height:26px; pointer-events:none; }
#touch-controls .direction-button.is-pressed,
#touch-controls .direction-button:active { background:#f3f3e9; color:#000; border-color:#fff; }
@media (hover:hover) {
  #touch-controls .direction-button:hover:not(.is-pressed) { background:#262826; }
}
.has-touch button { min-height:48px; }
.has-touch .mode-option { grid-template-columns:24px 1fr; min-height:56px; padding:9px 3px; margin-top:4px; gap:10px; align-items:center; }
.has-touch input[type="radio"] { width:20px; height:20px; margin:0; }
.has-touch input[type="range"] { height:48px; }
.has-touch input[type="range"]::-webkit-slider-thumb { width:26px; height:32px; margin-top:-14px; }
.has-touch input[type="range"]::-moz-range-thumb { width:22px; height:28px; }
.has-touch #setup-form > button { min-width:140px; }
/* Keep the same grid readable when a portrait game rotates into a short viewport. */
.touch-landscape #game {
  grid-template-columns:minmax(0,1fr) auto;
  grid-template-rows:24px minmax(0,1fr); column-gap:12px;
}
.touch-landscape #score { grid-row:1; grid-column:1; }
.touch-landscape #arena { grid-row:2; grid-column:1; }
.touch-landscape #touch-controls { grid-row:1 / 3; grid-column:2; align-self:center; padding:0; }
@media (max-width:560px) {
  .has-touch .panel { padding:18px; }
  .has-touch .instructions { margin-bottom:20px; }
  .has-touch .settings { gap:20px; margin-bottom:20px; }
  .has-touch #setup-form > button { width:100%; }
}

</style>
</head>
<body>
<section id="setup" class="screen" aria-labelledby="setup-title">
  <div class="panel">
    <p class="eyebrow"></p>
    <h1 id="setup-title">Titanaboa...</h1>
    <p class="instructions"><span class="touch-hint">Use the on-screen arrows to steer.<br></span>Arrow keys to steer. Space to pause / resume.<br>Avoid walls and your own body.<br></p>
    <form id="setup-form">
      <div class="settings">
        <div>
          <label class="speed-label" for="speed">Speed</label>
          <output id="speed-value" class="speed-value" for="speed">8 cells per second</output>
          <input id="speed" type="range" min="3" max="18" step="1" value="8">
          <div class="range-labels"><span>Slow</span><span>Fast</span></div>
          <fieldset>
            <legend>Game Mode</legend>
            <label class="mode-option"><input type="radio" name="mode" value="classic" checked><span><span class="mode-name">Classic</span><span class="mode-description">Traditional Snake.</span></span></label>
            <label class="mode-option"><input type="radio" name="mode" value="complex"><span><span class="mode-name">Complex</span><span class="mode-description">Moving Food.</span></span></label>
          </fieldset>
        </div>
        <div>
          <p class="preview-label">Preview</p>
          <div id="preview-frame">
            <canvas id="preview" width="280" height="160" role="img" aria-label="Preview of the selected speed and mode"></canvas>
          </div>
        </div>
      </div>
      <button type="submit">START</button>

    </form>
  </div>
</section>
<main id="game" aria-label="Snake game" hidden>
  <div id="score" aria-label="Hens eaten">0</div>
  <div id="arena"><div class="board-frame"><canvas id="board" role="img" aria-label="Snake playing field"></canvas></div></div>

  <div id="touch-controls" role="group" aria-label="Directional controls" hidden>
    <div class="direction-pad">
      <button class="direction-button" type="button" data-direction="ArrowUp" aria-label="Move up"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20V4M5 11l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="direction-button" type="button" data-direction="ArrowLeft" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 12H4M11 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="direction-button" type="button" data-direction="ArrowRight" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12h16M13 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="direction-button" type="button" data-direction="ArrowDown" aria-label="Move down"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v16M5 13l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
</main>
<section id="result" class="screen" aria-labelledby="result-title" hidden>
  <div class="panel">
    <p id="result-tag" class="eyebrow"></p>
    <h2 id="result-title"></h2>
    <p id="result-message"></p>
    <button id="new-game" type="button">NEW GAME</button>
  </div>
</section>
<script>
(() => {
  "use strict";
  const TARGET=150, INITIAL_LENGTH=4, PREVIEW_LENGTH=8;
  const PREVIEW_COLS=14, PREVIEW_ROWS=8, MAX_TURN_QUEUE=2, EPSILON=0.000001;
  // Choose logical dimensions once, independently of later rendering resizes.
  const initialWidth=Math.max(1,document.documentElement.clientWidth-14);
  const initialHeight=Math.max(1,window.innerHeight-42);
  const COLS=Math.max(20,Math.min(96,Math.floor(initialWidth/20)));
  const ROWS=Math.max(16,Math.min(72,Math.floor(initialHeight/20)));
  const DIR=Object.freeze({
    ArrowUp:Object.freeze({x:0,y:-1}), ArrowDown:Object.freeze({x:0,y:1}),
    ArrowLeft:Object.freeze({x:-1,y:0}), ArrowRight:Object.freeze({x:1,y:0})
  });
  const NEIGHBORS=[DIR.ArrowUp,DIR.ArrowDown,DIR.ArrowLeft,DIR.ArrowRight];
  const COLOR=Object.freeze({edge:"#d5d8d1",body:"#faf9f1",highlight:"#fffef9",scale:"#292d29",eye:"#d83243",black:"#101210"});
  const setup=document.getElementById("setup"), game=document.getElementById("game"), result=document.getElementById("result");
  const speedInput=document.getElementById("speed"), speedValue=document.getElementById("speed-value");
  const modeInputs=Array.from(document.querySelectorAll('input[name="mode"]'));
  const scoreDisplay=document.getElementById("score"), arena=document.getElementById("arena");
  const boardCanvas=document.getElementById("board"), boardContext=boardCanvas.getContext("2d",{alpha:false});
  const previewCanvas=document.getElementById("preview"), previewContext=previewCanvas.getContext("2d",{alpha:false});
  const previewFrame=document.getElementById("preview-frame");
  const touchControls=document.getElementById("touch-controls");
  const directionButtons=Array.from(touchControls.querySelectorAll(".direction-button"));
  const coarsePointer=window.matchMedia("(any-pointer: coarse)");
  let touchCapable=navigator.maxTouchPoints>0||coarsePointer.matches;
  let viewportWidth=window.innerWidth,viewportHeight=window.innerHeight;
  let padButtonSize=56,padGap=8;
  const controllerPointers=new Map();

  let state="setup", selectedSpeed=Number(speedInput.value), selectedMode="classic";
  let activeSpeed=selectedSpeed, activeMode=selectedMode, snakeStepMs=1000/activeSpeed, foodStepMs=1000, cellSize=20;
  let snake=[], food=null, direction=DIR.ArrowRight, turnQueue=[], score=0;
  let snakeElapsed=0, foodElapsed=0, gameClock=0, bite=null, suspended=false, manuallyPaused=false;
  let audioContext=null, lastFrame=performance.now();
  let renderDpr=window.devicePixelRatio||1;
  let previewCellSize=20, previewIndex=4, previewFood={x:7,y:4,facing:1,walk:0};
  let previewSnakeElapsed=0, previewFoodElapsed=0, previewClock=0, previewBite=null, previewSeed=0x3f27a951;
  const previewPath=[];
  for(let x=1;x<PREVIEW_COLS-1;x++) previewPath.push({x,y:1});
  for(let y=2;y<PREVIEW_ROWS-1;y++) previewPath.push({x:PREVIEW_COLS-2,y});
  for(let x=PREVIEW_COLS-3;x>=1;x--) previewPath.push({x,y:PREVIEW_ROWS-2});
  for(let y=PREVIEW_ROWS-3;y>=2;y--) previewPath.push({x:1,y});
  const sameCell=(a,b)=>a.x===b.x&&a.y===b.y;
  const sameDirection=(a,b)=>a.x===b.x&&a.y===b.y;
  const oppositeDirection=(a,b)=>a.x===-b.x&&a.y===-b.y;
  const clamp=value=>Math.max(0,Math.min(1,value));
  const ease=value=>{const t=clamp(value);return t*t*(3-2*t);};
  function previewRandom(){
    previewSeed^=previewSeed<<13; previewSeed^=previewSeed>>>17; previewSeed^=previewSeed<<5;
    return (previewSeed>>>0)/4294967296;
  }
  function movingFoodInterval(cellsPerSecond,pixelsPerCell){
    const snakePixelsPerSecond=cellsPerSecond*pixelsPerCell;
    // Keep a positive speed even when cells shrink to a single pixel.
    const foodPixelsPerSecond=Math.max(0.1,snakePixelsPerSecond-3);
    return pixelsPerCell*1000/foodPixelsPerSecond;
  }
  function unlockAudio(){
    try{
      const Audio=window.AudioContext||window.webkitAudioContext;
      if(!Audio)return;
      if(!audioContext||audioContext.state==="closed")audioContext=new Audio();
      if(audioContext.state==="suspended")audioContext.resume().catch(()=>{});
    }catch(_){audioContext=null;}
  }
  function playDing(){
    if(!audioContext||audioContext.state!=="running")return;
    const now=audioContext.currentTime;
    for(const voice of [{frequency:1046.5,volume:0.065,duration:0.25},{frequency:2093,volume:0.018,duration:0.18}]){
      const oscillator=audioContext.createOscillator(), gain=audioContext.createGain();
      oscillator.type="sine"; oscillator.frequency.setValueAtTime(voice.frequency,now);
      gain.gain.setValueAtTime(0,now);
      gain.gain.linearRampToValueAtTime(voice.volume,now+0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+voice.duration);
      gain.gain.linearRampToValueAtTime(0,now+voice.duration+0.025);
      oscillator.connect(gain); gain.connect(audioContext.destination);
      oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};
      oscillator.start(now); oscillator.stop(now+voice.duration+0.03);
    }
  }
  function randomEmptyCell(body,cols,rows,random){
    const occupied=new Set(body.map(cell=>cell.y*cols+cell.x));
    const freeCount=cols*rows-occupied.size;
    if(freeCount<=0)return null;
    let choice=Math.floor(random()*freeCount);
    for(let index=0;index<cols*rows;index++){
      if(!occupied.has(index)){
        if(choice===0)return{x:index%cols,y:Math.floor(index/cols),facing:1,walk:0};
        choice--;
      }
    }
    return null;
  }
  function randomFoodNeighbor(item,body,cols,rows,random){
    if(!item)return null;
    const occupied=new Set(body.map(cell=>cell.y*cols+cell.x)), valid=[];
    for(const offset of NEIGHBORS){
      const next={x:item.x+offset.x,y:item.y+offset.y};
      if(next.x>=0&&next.x<cols&&next.y>=0&&next.y<rows&&!occupied.has(next.y*cols+next.x))valid.push(next);
    }
    if(!valid.length)return item;
    const next=valid[Math.floor(random()*valid.length)];
    return {
      ...next,
      facing:next.x===item.x?(item.facing===-1?-1:1):(next.x<item.x?-1:1),
      walk:item.walk===1?0:1
    };
  }
  function setControlsDisabled(disabled){
    speedInput.disabled=disabled;
    for(const input of modeInputs)input.disabled=disabled;
  }
  function startGame(){
    clearControllerPresses();
    unlockAudio(); activeSpeed=selectedSpeed; activeMode=selectedMode; snakeStepMs=1000/activeSpeed;
    const x=Math.floor(COLS/3),y=Math.floor(ROWS/2);
    snake=Array.from({length:INITIAL_LENGTH},(_,index)=>({x:x-index,y}));
    direction=DIR.ArrowRight; turnQueue=[]; score=0; snakeElapsed=0; foodElapsed=0; gameClock=0;
    bite=null; suspended=false; manuallyPaused=false;
    food=randomEmptyCell(snake,COLS,ROWS,Math.random);
    scoreDisplay.textContent="0"; state="playing";
    setup.hidden=true; result.hidden=true; game.hidden=false; setControlsDisabled(true);
    if(document.activeElement instanceof HTMLElement)document.activeElement.blur();
    resizeBoard(); foodElapsed=0; lastFrame=performance.now(); drawGame();
  }
  function finishGame(won){
    clearControllerPresses();
    state="result"; snakeElapsed=0; foodElapsed=0; turnQueue=[]; bite=null; suspended=false; manuallyPaused=false;
    document.getElementById("result-tag").textContent=won?"MISSION COMPLETE":"";
    document.getElementById("result-title").textContent=won?"YOU WIN!":"GAME OVER";
    document.getElementById("result-message").textContent=won?"150 hens eaten.\nMission complete.":`${score} hens eaten.\nThe snake hit a wall or its own body.`;
    game.hidden=true; setup.hidden=true; result.hidden=false;
    document.getElementById("new-game").focus({preventScroll:true});
  }
  function showSetup(){
    clearControllerPresses();
    state="setup"; snake=[]; food=null; score=0; scoreDisplay.textContent="0"; direction=DIR.ArrowRight;
    turnQueue=[]; snakeElapsed=0; foodElapsed=0; gameClock=0; bite=null; suspended=false; manuallyPaused=false;
    game.hidden=true; result.hidden=true; setup.hidden=false; setControlsDisabled(false);
    resetPreview(); resize(); lastFrame=performance.now(); speedInput.focus({preventScroll:true});
  }
  function queueTurn(next){
    if(turnQueue.length>=MAX_TURN_QUEUE)return;
    const previous=turnQueue.length?turnQueue[turnQueue.length-1]:direction;
    if(!sameDirection(previous,next)&&!oppositeDirection(previous,next))turnQueue.push(next);
  }
  function requestDirection(key){
    if(state!=="playing"||suspended||manuallyPaused)return;
    if(Object.prototype.hasOwnProperty.call(DIR,key))queueTurn(DIR[key]);
  }
  function clearControllerPresses(){
    for(const [pointer,button]of controllerPointers){
      if(typeof pointer==="number"&&button.hasPointerCapture&&button.hasPointerCapture(pointer)){
        try{button.releasePointerCapture(pointer);}catch(_){}
      }
      button.classList.remove("is-pressed");
    }
    controllerPointers.clear();
  }
  function pressDirection(button,pointer){
    if(state!=="playing"||controllerPointers.has(pointer))return;
    controllerPointers.set(pointer,button);
    button.classList.add("is-pressed");
    requestDirection(button.dataset.direction);
  }
  function releaseDirection(pointer){
    const button=controllerPointers.get(pointer);
    if(!button)return;
    controllerPointers.delete(pointer);
    if(!Array.from(controllerPointers.values()).includes(button))button.classList.remove("is-pressed");
  }
  function syncViewport(){
    const viewport=window.visualViewport;
    viewportWidth=Math.floor(viewport?viewport.width:window.innerWidth);
    viewportHeight=Math.floor(viewport?viewport.height:window.innerHeight);
    const root=document.documentElement;
    root.style.setProperty("--viewport-width",viewportWidth+"px");
    root.style.setProperty("--viewport-height",viewportHeight+"px");
    padButtonSize=Math.max(48,Math.min(62,viewportHeight*0.075));
    root.style.setProperty("--pad-button",padButtonSize+"px");
    root.classList.toggle("has-touch",touchCapable);
    root.classList.toggle("touch-landscape",touchCapable&&viewportWidth>viewportHeight&&viewportHeight<560);
    touchControls.hidden=!touchCapable;
  }
  function detectTouch(){
    const detected=navigator.maxTouchPoints>0||coarsePointer.matches;
    if(detected&&!touchCapable){touchCapable=true;resize();}
  }
  function availableBoardSize(){
    const style=getComputedStyle(game);
    const horizontal=(parseFloat(style.paddingLeft)||0)+(parseFloat(style.paddingRight)||0);
    const vertical=(parseFloat(style.paddingTop)||0)+(parseFloat(style.paddingBottom)||0);
    let width=viewportWidth-horizontal-2;
    let height=viewportHeight-vertical-24-4-2;
    if(touchCapable){
      const padSize=3*padButtonSize+2*padGap;
      if(document.documentElement.classList.contains("touch-landscape"))width-=padSize+12;
      else height-=padSize+8+4;
    }
    return{width:Math.max(1,width),height:Math.max(1,height)};

  function moveSnake(){

    const newInterval=movingFoodInterval(selectedSpeed,previewCellSize);
    previewFoodElapsed=clamp(previewFoodElapsed/previousInterval)*newInterval;
    configureCanvas(previewCanvas,previewContext,PREVIEW_COLS*previewCellSize,PREVIEW_ROWS*previewCellSize);
    drawPreview();
  }
  function resize(){syncViewport();resizeBoard();resizePreview();}
  function updateSpeed(){
    if(state!=="setup")return;
    selectedSpeed=Number(speedInput.value);speedValue.value=`${selectedSpeed} cells per second`;
    speedInput.setAttribute("aria-valuetext",`${selectedSpeed} cells per second`);
    previewSnakeElapsed=0;previewFoodElapsed=0;previewBite=null;drawPreview();
  }
  function updateMode(){if(state!=="setup")return;selectedMode=modeInputs.find(input=>input.checked).value;resetPreview();}
  function suspend(){if(state!=="playing")return;clearControllerPresses();suspended=true;turnQueue=[];}
  function resume(){if(state!=="playing"||document.hidden)return;suspended=false;turnQueue=[];lastFrame=performance.now();}
  function togglePause(){clearControllerPresses();manuallyPaused=!manuallyPaused;turnQueue=[];lastFrame=performance.now();if(!manuallyPaused)unlockAudio();}
  function frame(now){
    if(renderDpr!==(window.devicePixelRatio||1)){renderDpr=window.devicePixelRatio||1;resize();}
    const elapsed=Math.max(0,now-lastFrame);lastFrame=now;
    if(state==="setup"&&!document.hidden){advancePreview(elapsed);drawPreview();}
    if(state==="playing"&&!suspended&&!manuallyPaused&&!document.hidden){advanceGame(elapsed);if(state==="playing")drawGame();}
    requestAnimationFrame(frame);
  }
  document.getElementById("setup-form").addEventListener("submit",event=>{event.preventDefault();if(state==="setup")startGame();});
  speedInput.addEventListener("input",updateSpeed);
  for(const input of modeInputs)input.addEventListener("change",updateMode);
  document.getElementById("new-game").addEventListener("click",showSetup);
  window.addEventListener("keydown",event=>{
    if(state!=="playing")return;
    if(event.code==="Space"||event.key===" "){event.preventDefault();if(!event.repeat)togglePause();return;}
    if(!Object.prototype.hasOwnProperty.call(DIR,event.key))return;
    event.preventDefault();if(!event.repeat)requestDirection(event.key);
  },{passive:false});
  // Pointer-down is the sole touch input event; release never changes direction.
  let lastControllerPointer=-Infinity;
  for(const button of directionButtons){
    if("PointerEvent"in window){
      button.addEventListener("pointerdown",event=>{
        if(event.pointerType==="mouse"&&event.button!==0)return;
        event.preventDefault();
        lastControllerPointer=performance.now();
        pressDirection(button,event.pointerId);
        try{button.setPointerCapture(event.pointerId);}catch(_){}
      },{passive:false});
      for(const name of ["pointerup","pointercancel","lostpointercapture"]){
        button.addEventListener(name,event=>{
          event.preventDefault();releaseDirection(event.pointerId);
        },{passive:false});
      }
    }else{
      // Older touch browsers use the same queue, without synthetic mouse repeats.
      button.addEventListener("touchstart",event=>{
        event.preventDefault();lastControllerPointer=performance.now();
        for(const touch of event.changedTouches)pressDirection(button,"touch-"+touch.identifier);
      },{passive:false});
      button.addEventListener("touchmove",event=>event.preventDefault(),{passive:false});
      for(const name of ["touchend","touchcancel"]){
        button.addEventListener(name,event=>{
          event.preventDefault();
          for(const touch of event.changedTouches)releaseDirection("touch-"+touch.identifier);
        },{passive:false});
      }
      button.addEventListener("mousedown",event=>{
        if(event.button!==0||performance.now()-lastControllerPointer<800)return;
        event.preventDefault();lastControllerPointer=performance.now();pressDirection(button,"mouse");
      });
    }
    button.addEventListener("click",event=>{
      event.preventDefault();
      // Assistive activation is allowed; a pointer's compatibility click is ignored.
      if(event.detail===0&&performance.now()-lastControllerPointer>800)requestDirection(button.dataset.direction);
    });
    button.addEventListener("contextmenu",event=>event.preventDefault());
    button.addEventListener("dblclick",event=>event.preventDefault());
  }
  window.addEventListener("mouseup",()=>releaseDirection("mouse"));
  window.addEventListener("pointerup",event=>releaseDirection(event.pointerId));
  window.addEventListener("pointercancel",event=>releaseDirection(event.pointerId));
  window.addEventListener("pointerdown",event=>{
    if((event.pointerType==="touch"||event.pointerType==="pen")&&!touchCapable){touchCapable=true;resize();}
  },{passive:true});
  if(coarsePointer.addEventListener)coarsePointer.addEventListener("change",detectTouch);
  else if(coarsePointer.addListener)coarsePointer.addListener(detectTouch);
  if(window.visualViewport)window.visualViewport.addEventListener("resize",resize);
  window.addEventListener("orientationchange",resize);
  window.addEventListener("blur",suspend);window.addEventListener("focus",resume);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)suspend();else resume();});
  window.addEventListener("resize",resize);
  if("ResizeObserver"in window){const observer=new ResizeObserver(resizePreview);observer.observe(previewFrame);}
  updateSpeed();resize();resetPreview();
  // Exactly one animation loop for all starts, finishes, and restarts.
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
